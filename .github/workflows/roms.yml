name: Compilar Retro23
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Criar projeto
        run: |
          sed -n '75,123p' .github/workflows/build.yml | sed 's/^          //' > /tmp/create-project.sh
          bash /tmp/create-project.sh
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Retro23-debug.apk
          gh release create catalogo-v2 Retro23-debug.apk --title 'Retro23 com seletor de ROMs' --notes 'Catálogo de 23 consoles sem PS1. Seleciona ROMs locais para abrir em outros aplicativos compatíveis. Não contém ROMs nem emuladores. Requer emulador externo; nem todos aceitam esta forma de abertura.'
