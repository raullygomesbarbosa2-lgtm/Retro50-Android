name: Compilar Retro21
on:
  push:
    paths: ['.github/workflows/retro21.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Criar projeto
        run: |
          sed -n '75,123p' .github/workflows/build.yml | sed 's/^          //' > /tmp/create-project.sh
          bash /tmp/create-project.sh
          sed -i 's/"Nintendo 64", //; s/"Nintendo DS", //; s/RETRO 23/RETRO 21/' app/src/main/java/br/com/retro50/MainActivity.java
          sed -i "s/versionCode 2; versionName '0.2'/versionCode 3; versionName '0.3'/" app/build.gradle
          grep 'private final String\[\] consoles' app/src/main/java/br/com/retro50/MainActivity.java
      - name: Compilar APK
        run: gradle --no-daemon assembleDebug
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Retro21-debug.apk
          gh release create catalogo-v3 Retro21-debug.apk --title 'Retro21 sem Nintendo DS e Nintendo 64' --notes 'Catálogo de 21 consoles, sem Nintendo DS nem Nintendo 64. Não contém ROMs nem emuladores, e para abrir ROMs depende de outro app compatível.'
